services:
  - type: web
    name: gembabot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ALLOWED_USER_IDS
        sync: false
      - key: OWNER_USER_IDS
        sync: false
      - key: RENDER_FREE_MODE
        value: "1"
      - key: ENABLE_FILE_LOG
        value: "0"
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: data/bot.sqlite3
