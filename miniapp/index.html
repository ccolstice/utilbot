<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101923">
    <title>Архив</title>
    <link rel="stylesheet" href="/miniapp/styles.css?v=4">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/miniapp/app.js?v=4" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">ЛИЧНОЕ ХРАНИЛИЩЕ</p>
          <h1>Архив</h1>
        </div>
        <div class="top-actions">
          <span id="result-count" class="result-count">Загрузка…</span>
          <button id="select-mode" class="quiet-button" type="button">Выбрать</button>
        </div>
      </header>

      <section class="filter-panel" aria-label="Поиск и фильтры">
        <label class="search-box">
          <span aria-hidden="true">⌕</span>
          <input id="search" type="search" placeholder="Найти в архиве" autocomplete="off">
          <button id="clear-search" class="clear-search" type="button" aria-label="Очистить поиск">×</button>
        </label>
        <div class="filters-row">
          <div class="folder-filter-row"><select id="folder-filter" aria-label="Папка"><option value="">Все папки</option></select><button id="create-folder" class="quiet-button" type="button">＋ Папка</button></div>
          <select id="kind-filter" aria-label="Тип материала">
            <option value="all">Все типы</option>
            <option value="photo">Фото</option><option value="text">Текст</option>
            <option value="link">Ссылки</option><option value="document">Файлы</option>
            <option value="video">Видео</option><option value="audio">Аудио</option>
            <option value="voice">Голосовые</option><option value="sticker">Стикеры</option>
          </select>
          <select id="state-filter" aria-label="Статус">
            <option value="all">Любой статус</option><option value="inbox">Входящие</option>
            <option value="later">На потом</option><option value="saved">Разобрано</option>
            <option value="done">Готово</option>
          </select>
        </div>
        <div class="filter-bottom">
          <label class="tag-filter"><span>#</span><input id="tag-filter" type="text" placeholder="Фильтр по тегу"></label>
          <button id="favorites-filter" class="chip-button" type="button" aria-pressed="false">☆ Избранное</button>
        </div>
      </section>

      <section id="folder-drop-zone" class="folder-drop-zone" aria-label="Переместить в папку" hidden>
        <span class="drop-zone-hint">Перетащи материал в папку</span><div id="folder-drop-targets" class="folder-drop-targets"></div>
      </section>

      <div id="error-banner" class="error-banner" hidden></div>
      <section id="item-grid" class="item-grid" aria-live="polite"></section>
      <div id="empty-state" class="empty-state" hidden>
        <div class="empty-icon">⌕</div><h2>Ничего не нашлось</h2>
        <p>Попробуй изменить запрос или фильтры.</p>
        <button id="reset-filters" class="primary-button" type="button">Сбросить фильтры</button>
      </div>
      <nav class="pagination" aria-label="Страницы">
        <button id="previous-page" class="quiet-button" type="button">← Назад</button>
        <span id="page-label"></span>
        <button id="next-page" class="quiet-button" type="button">Дальше →</button>
      </nav>
    </main>

    <aside id="selection-bar" class="selection-bar" hidden>
      <div class="selection-info"><strong id="selected-count">0</strong><span> выбрано</span></div>
      <div class="selection-actions">
        <button data-action="move" type="button">📁 Папка</button>
        <button data-action="tag" type="button">🏷 Тег</button>
        <button data-action="state" type="button">↔ Статус</button>
        <button data-action="favorite" type="button">⭐</button>
        <button data-action="delete" class="danger-action" type="button">🗑</button>
        <button id="clear-selection" class="cancel-selection" type="button">×</button>
      </div>
    </aside>

    <dialog id="detail-dialog" class="sheet detail-sheet">
      <form method="dialog" class="sheet-close-row"><button class="close-button" aria-label="Закрыть">×</button></form>
      <div id="detail-content"></div>
    </dialog>
    <dialog id="action-dialog" class="sheet action-sheet">
      <form method="dialog" class="sheet-close-row"><button class="close-button" aria-label="Закрыть">×</button></form>
      <h2 id="action-title">Действие с материалами</h2>
      <div id="action-form"></div>
    </dialog>
    <dialog id="folder-dialog" class="sheet action-sheet">
      <form method="dialog" class="sheet-close-row"><button class="close-button" aria-label="Закрыть">×</button></form>
      <h2>Новая папка</h2>
      <form id="folder-form" class="action-form">
        <label>Название<input name="name" maxlength="40" placeholder="Например, Идеи" required></label>
        <div class="form-actions"><button type="button" class="secondary" data-cancel>Отмена</button><button type="submit">Создать</button></div>
      </form>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
